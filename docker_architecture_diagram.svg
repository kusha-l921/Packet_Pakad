<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" width="1000" height="1020" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <!-- Component Icon Definition -->
    <g id="component-icon">
      <rect x="0" y="0" width="16" height="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" rx="1"/>
      <rect x="-3" y="2" width="6" height="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="-3" y="7" width="6" height="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Simplified Docker-Based IPsec Analyzer Architecture</text>

  <!-- Outer Frame: Docker Host (docker-compose) -->
  <rect x="25" y="60" width="950" height="935" fill="none" stroke="#1e293b" stroke-width="1.8" rx="4"/>
  <text x="500" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Docker Host (docker-compose)</text>

  <!-- ==================== LEFT BOX: Network: ipsec-wan (Bridge) ==================== -->
  <rect x="45" y="100" width="410" height="375" fill="none" stroke="#1e293b" stroke-width="1.5" rx="3"/>
  <text x="250" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Network: ipsec-wan (Bridge)</text>

  <!-- Container: vpn-gateway-a (StrongSwan Initiator) -->
  <!-- 3D Bevel container look -->
  <path d="M 65 145 L 395 145 L 415 160 L 415 275 L 85 275 L 65 260 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="1.3"/>
  <rect x="65" y="160" width="330" height="115" fill="#ffffff" stroke="#1e293b" stroke-width="1.3" rx="2"/>
  <text x="230" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">gw-hq / vpn-gateway-a</text>
  <text x="230" y="196" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">(StrongSwan Initiator)</text>

  <!-- Component inside Initiator: Traffic Generator -->
  <rect x="85" y="210" width="125" height="50" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" rx="2"/>
  <use href="#component-icon" x="190" y="214"/>
  <text x="147" y="232" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Traffic Generator</text>
  <text x="147" y="247" text-anchor="middle" font-size="9.5" fill="#64748b">(VoIP, Web, Bulk)</text>

  <!-- Arrow Generator -> Engine A -->
  <line x1="210" y1="235" x2="250" y2="235" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Component inside Initiator: IPsec Engine A -->
  <rect x="255" y="210" width="120" height="50" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" rx="2"/>
  <use href="#component-icon" x="355" y="214"/>
  <text x="315" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">IPsec Engine A</text>

  <!-- Container: vpn-gateway-b (StrongSwan Responder) -->
  <path d="M 115 330 L 375 330 L 395 345 L 395 440 L 135 440 L 115 425 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="1.3"/>
  <rect x="115" y="345" width="260" height="95" fill="#ffffff" stroke="#1e293b" stroke-width="1.3" rx="2"/>
  <text x="245" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">gw-branch / vpn-gateway-b</text>
  <text x="245" y="381" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">(StrongSwan Responder)</text>

  <!-- Component inside Responder: IPsec Engine B -->
  <rect x="185" y="392" width="125" height="40" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" rx="2"/>
  <use href="#component-icon" x="290" y="396"/>
  <text x="247" y="417" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">IPsec Engine B</text>

  <!-- Encrypted IPsec Tunnel Arrow (Engine B -> Engine A) -->
  <path d="M 270 392 L 310 268" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="345" y="325" text-anchor="start" font-size="10.5" font-weight="bold" fill="#0f172a">Encrypted IPsec Tunnel</text>
  <text x="345" y="340" text-anchor="start" font-size="9.5" fill="#475569">(IKE UDP 500/4500 &amp; ESP Proto 50)</text>

  <!-- ==================== RIGHT BOX: traffic-analyzer (Python Engine) ==================== -->
  <path d="M 480 345 L 935 345 L 955 360 L 955 700 L 500 700 L 480 685 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <rect x="480" y="360" width="455" height="340" fill="#ffffff" stroke="#1e293b" stroke-width="1.4" rx="2"/>
  <text x="707" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">traffic-analyzer / ipsec-analyzer</text>
  <text x="707" y="401" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">(Python Rule &amp; Analytics Engine)</text>

  <!-- Dashed Line: Sniffs Shared Interface -->
  <path d="M 415 240 Q 480 270 560 415" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <text x="540" y="305" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Sniffs Shared Interface</text>
  <text x="540" y="320" text-anchor="middle" font-size="9" fill="#475569">(network_mode: "container:gw-hq")</text>

  <!-- Component inside Analyzer: Packet Sniffer -->
  <rect x="540" y="415" width="200" height="50" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" rx="2"/>
  <use href="#component-icon" x="720" y="419"/>
  <text x="640" y="437" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Packet Sniffer</text>
  <text x="640" y="452" text-anchor="middle" font-size="10" fill="#64748b">(Scapy / PyShark / Libpcap)</text>

  <!-- Arrow Sniffer -> Compacted Analysis Pipeline Block -->
  <line x1="640" y1="465" x2="640" y2="505" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="645" y="488" text-anchor="start" font-size="9.5" fill="#475569">Captured Handshakes &amp; ESP Flows</text>

  <!-- COMPACTED BLOCK: Analysis Pipeline Block (With PQC) -->
  <rect x="505" y="505" width="405" height="175" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5" rx="3"/>
  <use href="#component-icon" x="888" y="511"/>
  <text x="707" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Analysis Pipeline (Audit, PQC &amp; ML)</text>
  
  <!-- Content inside Compacted Pipeline Block -->
  <line x1="520" y1="542" x2="895" y2="542" stroke="#cbd5e1" stroke-width="1"/>
  
  <text x="525" y="563" font-size="11" font-weight="600" fill="#0f172a">• Post-Quantum Cryptography (PQC) Audit:</text>
  <text x="540" y="580" font-size="10" fill="#334155">- NIST PQC Algorithms: ML-KEM (Kyber) &amp; ML-DSA (Dilithium)</text>
  <text x="540" y="596" font-size="10" fill="#334155">- RFC 9370 Hybrid Key Exchange &amp; CNSA 2.0 Posture Rating</text>
  
  <text x="525" y="618" font-size="11" font-weight="600" fill="#0f172a">• RFC Compliance &amp; Deterministic Scoring:</text>
  <text x="540" y="634" font-size="10" fill="#334155">- 12-Category Rule Engine (NIST SP 800-77 &amp; RFC 8247)</text>

  <text x="525" y="655" font-size="11" font-weight="600" fill="#0f172a">• ML ESP Traffic Classifier &amp; Side-Channel Inference</text>

  <!-- Arrow Analyzer -> Dashboard -->
  <line x1="707" y1="700" x2="707" y2="765" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="715" y="730" text-anchor="start" font-size="10.5" font-weight="bold" fill="#0f172a">Structured Results</text>
  <text x="715" y="744" text-anchor="start" font-size="9.5" fill="#475569">(JSON / SQLite / assessment_output)</text>

  <!-- ==================== BOTTOM BOX: dashboard-app (Web & API) ==================== -->
  <path d="M 525 750 L 890 750 L 910 765 L 910 965 L 545 965 L 525 950 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <rect x="525" y="765" width="365" height="200" fill="#ffffff" stroke="#1e293b" stroke-width="1.4" rx="2"/>
  <text x="707" y="790" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">dashboard-app (Web &amp; API)</text>

  <!-- Component inside Dashboard: FastAPI Backend -->
  <rect x="635" y="805" width="145" height="42" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" rx="2"/>
  <use href="#component-icon" x="760" y="809"/>
  <text x="707" y="831" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">FastAPI Backend</text>

  <!-- Branching Arrows from FastAPI -->
  <line x1="680" y1="847" x2="620" y2="898" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="735" y1="847" x2="795" y2="898" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Component inside Dashboard: Analyst Web UI -->
  <rect x="545" y="900" width="160" height="48" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" rx="2"/>
  <use href="#component-icon" x="685" y="904"/>
  <text x="625" y="920" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Analyst Web UI</text>
  <text x="625" y="934" text-anchor="middle" font-size="9" fill="#64748b">(Next.js / Threat Matrix)</text>

  <!-- Component inside Dashboard: Report Generator -->
  <rect x="725" y="900" width="150" height="48" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" rx="2"/>
  <use href="#component-icon" x="855" y="904"/>
  <text x="800" y="920" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Report Generator</text>
  <text x="800" y="934" text-anchor="middle" font-size="9" fill="#64748b">(PQC Audit / PDF / JSON)</text>

</svg>
